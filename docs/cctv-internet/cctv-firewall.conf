# --- Firewall policies (Option A: NAT disabled toward wan1) -------------------
config firewall policy
    edit 10
        set name "nvr-to-internet-https"
        set srcintf "lan"
        set dstintf "wan1"
        set srcaddr "NVR"
        set dstaddr "all"
        set schedule "always"
        set service "HTTPS"
        set action accept
        set nat disable
        set logtraffic all
        set comments "NVR firmware / vendor cloud only"
    next
    edit 11
        set name "deny-cctv-to-private-nets"
        set srcintf "lan"
        set dstintf "wan1"
        set srcaddr "CCTV_LAN"
        set dstaddr "RFC1918"
        set schedule "always"
        set service "ALL"
        set action deny
        set logtraffic all
        set comments "Cameras never reach WiFi LAN / transit / other RFC1918"
    next
    edit 12
        set name "deny-cameras-direct-internet"
        set srcintf "lan"
        set dstintf "wan1"
        set srcaddr "CCTV_LAN"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set action deny
        set logtraffic all
        set comments "Default deny: cameras get no direct Internet"
    next
    edit 13
        set name "admin-to-nvr"
        set srcintf "wan1"
        set dstintf "lan"
        set srcaddr "ADMIN_HOST"
        set dstaddr "NVR"
        set schedule "always"
        set service "HTTPS" "RTSP" "PING"
        set action accept
        set nat disable
        set logtraffic all
        set comments "Admin host (via WiFi-FW) may manage/view NVR"
    next
end

# Allow admin to manage THIS FortiGate on wan1 (local-in)
# Prefer restricting trusthosts; HTTPS on wan1 allowaccess is already set above.
config system admin
    edit "admin"
        set trusthost1 192.168.10.50 255.255.255.255
        set trusthost2 192.168.20.0 255.255.255.0
    next
end

# =============================================================================
# Option B only (double NAT) — uncomment if you cannot add a static route on
# the WiFi-Firewall. Then ALSO enable NAT on policy 10 above (set nat enable)
# and you may remove the WiFi-Firewall static route to 192.168.20.0/24.
