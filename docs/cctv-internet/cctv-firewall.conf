# =============================================================================
# CAWW - CCTV-Firewall (FortiGate / FortiOS)
# Role: protects the CCTV network.
#   wan1 = cable to WiFi-Firewall port3 (transit 172.16.255.0/30)
#   lan  = cameras, NVR, PoE switch (192.168.20.0/24)
#
# Implements Option A (routed, NO NAT on this box) from
# docs/cctv-internet/README.md
#
# BEFORE APPLYING:
#   - Confirm interface names for your FortiGate model
#   - Untick / disable "block private / bogon" on wan1 if GUI exposes it
#     (upstream is a private transit network)
# =============================================================================

config system interface
    edit "wan1"
        set vdom "root"
        set ip 172.16.255.2 255.255.255.252
        set allowaccess ping https
        set type physical
        set role wan
        set description "Transit to WiFi-Firewall port3"
    next
    edit "lan"
        set vdom "root"
        set ip 192.168.20.1 255.255.255.0
        set allowaccess ping https ssh
        set type physical
        set role lan
        set description "CCTV LAN (cameras / NVR)"
    next
end

# Default route toward WiFi-Firewall
config router static
    edit 1
        set gateway 172.16.255.1
        set device "wan1"
        set comment "Default via WiFi-Firewall"
    next
end

# --- Address objects ----------------------------------------------------------
config firewall address
    edit "CCTV_LAN"
        set subnet 192.168.20.0 255.255.255.0
    next
    edit "NVR"
        set subnet 192.168.20.10 255.255.255.255
        set comment "NVR / VMS"
    next
    edit "ADMIN_HOST"
        set subnet 192.168.10.50 255.255.255.255
        set comment "Admin workstation on WiFi LAN"
    next
    edit "RFC1918_10"
        set subnet 10.0.0.0 255.0.0.0
    next
    edit "RFC1918_172"
        set subnet 172.16.0.0 255.240.0.0
    next
    edit "RFC1918_192"
        set subnet 192.168.0.0 255.255.0.0
    next
end

config firewall addrgrp
    edit "RFC1918"
        set member "RFC1918_10" "RFC1918_172" "RFC1918_192"
    next
end

config firewall service custom
    edit "RTSP"
        set tcp-portrange 554
    next
end

# --- DNS / NTP for cameras via this FortiGate ---------------------------------
config system dns-server
    edit "lan"
        set mode recursive
    next
end

config system dns
    set primary 9.9.9.9
    set secondary 149.112.112.112
end

config system ntp
    set ntpsync enable
    set type fortiguard
end

# DHCP for cameras (prefer MAC reservations in production)
config system dhcp server
    edit 1
        set dns-service default
        set default-gateway 192.168.20.1
        set netmask 255.255.255.0
        set interface "lan"
        config ip-range
            edit 1
                set start-ip 192.168.20.100
                set end-ip 192.168.20.199
            next
        end
        set timezone-option default
        set ntp-service default
    next
end

