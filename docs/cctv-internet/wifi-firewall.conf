# =============================================================================
# CAWW - WiFi-Firewall (FortiGate / FortiOS)
# Role: Internet edge.
#   wan1  = ISP uplink
#   lan   = WiFi / user network 192.168.10.0/24
#   port3 = dedicated transit to CCTV-Firewall (rename if your model differs)
#
# Implements Option A (routed, single NAT at this edge) from
# docs/cctv-internet/README.md
#
# BEFORE APPLYING:
#   - Confirm interface names: get system interface physical
#   - Adjust admin host / NVR addresses if CAWW uses different IPs
#   - Merge carefully if policies already exist (do not blindly wipe)
# =============================================================================

config system interface
    edit "lan"
        set vdom "root"
        set ip 192.168.10.1 255.255.255.0
        set allowaccess ping https ssh
        set type physical
        set device-identification enable
        set role lan
        set description "WiFi / user LAN"
    next
    edit "port3"
        set vdom "root"
        set ip 172.16.255.1 255.255.255.252
        set allowaccess ping
        set type physical
        set role lan
        set alias "CCTV_TRANSIT"
        set description "Transit link to CCTV-Firewall wan1"
    next
end

# --- Address objects ----------------------------------------------------------
config firewall address
    edit "WIFI_LAN"
        set subnet 192.168.10.0 255.255.255.0
    next
    edit "CCTV_LAN"
        set subnet 192.168.20.0 255.255.255.0
    next
    edit "CCTV_TRANSIT_NET"
        set subnet 172.16.255.0 255.255.255.252
    next
    edit "CCTV_FW_WAN"
        set subnet 172.16.255.2 255.255.255.255
    next
    edit "NVR"
        set subnet 192.168.20.10 255.255.255.255
        set comment "NVR / VMS"
    next
    edit "ADMIN_HOST"
        set subnet 192.168.10.50 255.255.255.255
        set comment "Admin workstation allowed into CCTV zone"
    next
end

config firewall addrgrp
    edit "CCTV_ZONE"
        set member "CCTV_LAN" "CCTV_TRANSIT_NET"
    next
end

# Custom services if RTSP is not already defined on this FortiOS build
config firewall service custom
    edit "RTSP"
        set tcp-portrange 554
        set comment "RTSP camera / NVR streaming"
    next
end

# --- Static route to CCTV LAN (Option A) -------------------------------------
config router static
    edit 20
        set dst 192.168.20.0 255.255.255.0
        set gateway 172.16.255.2
        set device "port3"
        set comment "CCTV network behind CCTV-Firewall"
    next
end

# --- Firewall policies --------------------------------------------------------
# Order matters: deny CCTV->WiFi before allow CCTV->Internet.
# Policy IDs are examples — change if they collide.

config firewall policy
    edit 100
        set name "deny-cctv-to-wifi-lan"
        set srcintf "port3"
        set dstintf "lan"
        set srcaddr "all"
        set dstaddr "WIFI_LAN"
        set schedule "always"
        set service "ALL"
        set action deny
        set logtraffic all
        set comments "CCTV zone must never reach WiFi / user devices"
    next
    edit 101
        set name "allow-cctv-to-internet-web"
        set srcintf "port3"
        set dstintf "wan1"
        set srcaddr "CCTV_ZONE"
        set dstaddr "all"
        set schedule "always"
        set service "HTTP" "HTTPS"
        set action accept
        set nat enable
        set logtraffic all
        set comments "NVR updates / vendor cloud (filtered further on CCTV-FW)"
    next
    edit 102
        set name "allow-cctv-to-internet-dns-ntp"
        set srcintf "port3"
        set dstintf "wan1"
        set srcaddr "CCTV_ZONE"
        set dstaddr "all"
        set schedule "always"
        set service "DNS" "NTP"
        set action accept
        set nat enable
        set logtraffic all
    next
    edit 103
        set name "deny-cctv-default"
        set srcintf "port3"
        set dstintf "wan1"
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set action deny
        set logtraffic all
        set comments "Default deny from CCTV transit"
    next
    edit 104
        set name "admin-to-cctv-zone"
        set srcintf "lan"
        set dstintf "port3"
        set srcaddr "ADMIN_HOST"
        set dstaddr "CCTV_ZONE"
        set schedule "always"
        set service "HTTPS" "RTSP" "PING"
        set action accept
        set nat disable
        set logtraffic all
        set comments "Only admin host may enter CCTV zone"
    next
    edit 105
        set name "deny-wifi-to-cctv"
        set srcintf "lan"
        set dstintf "port3"
        set srcaddr "WIFI_LAN"
        set dstaddr "CCTV_ZONE"
        set schedule "always"
        set service "ALL"
        set action deny
        set logtraffic all
        set comments "Everyone else on WiFi stays out of CCTV"
    next
end

